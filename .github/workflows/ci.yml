on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show project files
        run: ls -la

      - name: Build backend image
        run: docker build -t gagan681/docker-lab-backend:latest ./backend

      - name: Push backend image
        run: docker push gagan681/docker-lab-backend:latest

      - name: Build frontend image
        run: docker build -t gagan681/docker-lab-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push gagan681/docker-lab-frontend:latest

      - name: Start application
        run: docker compose up -d
        continue-on-error: true

      - name: Test backend health
        run: curl --fail http://localhost:8000/health

      - name: Check frontend
        run: |
         sleep 5
         curl --fail http://localhost:3000

      - name: Check application status
        run: docker compose ps

      - name: Show database logs
        run: docker compose logs db

      - name: Stop application
        if: always()
        run: docker compose down


  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "ERROR: EC2_SSH_KEY secret is empty or unavailable"
            exit 1
          else
            echo "EC2_SSH_KEY secret is present"
          fi

          printf '%s\n' "$EC2_SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          test -s deploy_key.pem

          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i deploy_key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
            cd ~/docker-lab
            git pull origin master
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          EOF

          rm -f deploy_key.pem
