on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show project files
        run: ls -la

      - name: Build backend image
        run: docker build -t gagan681/docker-lab-backend:latest ./backend

      - name: Push backend image
        run: docker push gagan681/docker-lab-backend:latest

      - name: Build frontend image
        run: docker build -t gagan681/docker-lab-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push gagan681/docker-lab-frontend:latest

      - name: Start application
        run: docker compose up -d

      - name: Test backend health
        run: curl --fail http://localhost:8000/health

      - name: Check frontend
        run: |
          sleep 5
          curl --fail http://localhost:3000

      - name: Check application status
        run: docker compose ps

      - name: Show database logs
        if: always()
        run: docker compose logs db

      - name: Stop application
        if: always()
        run: docker compose down

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          set -e

          echo "Starting SSH agent..."
          eval "$(ssh-agent -s)"

          echo "Loading EC2 private key..."
          printf '%s\n' "$EC2_SSH_KEY" | ssh-add -

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "Getting EC2 host key..."
          ssh-keyscan -T 10 -H "$EC2_HOST" > ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: Could not retrieve EC2 host key"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

          echo "EC2 host key added successfully"

          echo "Testing SSH connection..."
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'"

          echo "Deploying application..."

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$EC2_USER@$EC2_HOST" << 'EOF'

            set -e

            cd ~/docker-lab

            echo "Pulling latest Git changes..."
            git pull origin master

            echo "Pulling latest Docker images..."
            docker compose pull

            echo "Starting application..."
            docker compose up -d --remove-orphans

            echo "Application status:"
            docker compose ps

          EOF

          echo "Deployment completed successfully"

          ssh-agent -k
